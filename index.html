<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Peach Barn</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Peach Barn">
<meta name="theme-color" content="#121014">
<style>
  :root{--bg:#121014;--card:#1b181f;--card2:#25212b;--line:#332d3a;--tx:#f0ecf2;--mut:#9a92a6;--acc:#f0a070;--acc2:#7fd1b9;--red:#e46f7a;--blue:#8db4ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom)) 0}
  header{padding:14px 16px 8px;position:sticky;top:0;background:linear-gradient(var(--bg) 85%,transparent);z-index:5}
  header h1{margin:0;font-size:18px;letter-spacing:.3px}
  header .sub{color:var(--mut);font-size:13px;margin-top:2px}
  .sync{float:right;font-size:11px;color:var(--mut);padding:3px 8px;border:1px solid var(--line);border-radius:999px;margin-top:2px}
  .sync.ok{color:var(--acc2);border-color:#2f5a4c}
  .sync.warn{color:var(--acc);border-color:#6a4a2a}
  .syncbar{margin:0 12px 8px;background:#3a2e16;border:1px solid #6a4a2a;color:var(--acc);padding:8px 10px;border-radius:10px;font-size:13px}
  main{padding:0 12px}
  .daytabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
  .daytabs::-webkit-scrollbar{display:none}
  .daytabs button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--mut);padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600}
  .daytabs button.on{background:var(--acc);color:#2a1408;border-color:var(--acc)}
  .daytabs button.today{border-color:var(--acc2)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .card.cut{border-style:dashed}
  .ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .ex-name{font-weight:700;font-size:16px}
  .ex-meta{color:var(--mut);font-size:13px;margin-top:2px}
  .tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--mut);margin-right:4px;vertical-align:middle}
  .tag.ss{color:var(--blue)}
  .tag.cut{color:var(--red)}
  .tag.rot{color:var(--acc)}
  .tag.vec{color:var(--acc2)}
  .last{margin:8px 0 6px;font-size:13px;color:var(--mut);background:var(--card2);padding:7px 9px;border-radius:8px}
  .last b{color:var(--tx)}
  .hint{font-size:13px;color:var(--acc2);margin:4px 0 6px}
  .sets{display:grid;grid-template-columns:28px 1fr 1fr 58px;gap:6px;align-items:center;margin-top:6px}
  .sets .h{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .sets .n{color:var(--mut);font-size:13px;text-align:center}
  input[type=number],input[type=text]{width:100%;background:#0d0b10;border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:10px 8px;font-size:17px;text-align:center}
  input:focus{outline:none;border-color:var(--acc)}
  input.pre{color:var(--acc2)}
  .row{display:flex;gap:8px;margin-top:10px}
  .btn{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--tx);padding:11px;border-radius:10px;font-size:14px;font-weight:600}
  .btn.p{background:var(--acc);color:#2a1408;border-color:var(--acc)}
  .btn.g{background:var(--acc2);color:#042117;border-color:var(--acc2)}
  .btn.sm{flex:0 0 auto;padding:7px 11px;font-size:13px}
  .btn.danger{color:var(--red)}
  .warm{color:var(--mut);font-size:13px;margin:0 2px 10px}
  .phase{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .phase .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--mut)}
  .phase .pill b{color:var(--tx)}
  nav{position:fixed;bottom:0;left:0;right:0;background:#0d0b10;border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
  nav a{flex:1;text-align:center;color:var(--mut);text-decoration:none;font-size:12px;padding:6px 0}
  nav a.on{color:var(--acc)}
  nav a span{display:block;font-size:20px}
  .timer{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));background:var(--acc);color:#2a1408;border-radius:12px;padding:12px 14px;display:none;justify-content:space-between;align-items:center;font-weight:700;font-size:18px;z-index:7;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .timer.on{display:flex}
  .timer.done{background:var(--acc2)}
  .timer button{background:rgba(0,0,0,.18);border:none;color:inherit;padding:6px 12px;border-radius:8px;font-weight:700}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20}
  .sheet-bg.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto;z-index:21;transform:translateY(100%);transition:transform .2s}
  .sheet.on{transform:none}
  .sheet h3{margin:0 0 10px;font-size:16px}
  .opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--tx);padding:12px;border-radius:10px;margin-bottom:8px;font-size:15px}
  .opt.cur{border-color:var(--acc);color:var(--acc)}
  .seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin:8px 0 12px}
  .seg button{flex:1;background:transparent;border:none;color:var(--mut);padding:8px;border-radius:8px;font-weight:600}
  .seg button.on{background:var(--acc);color:#2a1408}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase}
  h2{font-size:15px;margin:14px 2px 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  .note{color:var(--mut);font-size:13px;margin:6px 2px}
  select{background:#0d0b10;color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:15px;width:100%}
  .done-banner{background:#163a2e;border:1px solid #2f5a4c;color:var(--acc2);padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:14px}
  .ol{margin:0;padding-left:18px;font-size:14px;color:var(--tx)}
  .ol li{margin-bottom:6px}
  textarea{width:100%;background:#0d0b10;color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:8px;font-size:12px;min-height:90px}
</style>
</head>
<body>
<header>
  <span class="sync" id="sync">local</span>
  <h1 id="title">🍑 The Peach Barn</h1>
  <div class="sub" id="subtitle"></div>
</header>
<div class="syncbar" id="syncbar" style="display:none"><b>Saved on this phone only.</b> Your numbers won't follow you to another browser, the home-screen icon, or another phone. <a href="#" onclick="App.syncHelp();return false" style="color:var(--acc)">How to keep them safe</a></div>
<main id="main"></main>
<div class="timer" id="timer"><span id="timerTxt">Rest 2:00</span><div><button onclick="App.timerAdd(30)">+30s</button> <button onclick="App.timerStop()">Done</button></div></div>
<div class="sheet-bg" id="sheetBg" onclick="App.closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<nav>
  <a href="#today" id="nav-today"><span>🍑</span>Workout</a>
  <a href="#program" id="nav-program"><span>📋</span>Program</a>
  <a href="#history" id="nav-history"><span>📈</span>History</a>
  <a href="#settings" id="nav-settings"><span>⚙️</span>Settings</a>
</nav>
<script>

// several times a week with the variant changing each session. Every workout runs the same eight patterns:
//   Thrust (horizontal glute) → Hinge → Knee-dominant (glute-biased squat pattern) → Push → Pull →
//   Lateral (abduction / band) → Core → Pump finisher.
// The hip thrust anchors every session; the thrust and the hinge are where load climbs. Pump slots chase
// the burn. Leg-lean bias: the knee-dominant slot is the glute version (long stride, forward lean, high
// step), 2 sets, never heavy — no back squats, leg press or extensions in the program.

const ACT='Band seated abduction ×20, band glute bridge ×10 with a 2-s squeeze. (2 min)';
const ACT_FULL='Band seated abduction ×20, band glute bridge ×15 (2-s squeeze), side-lying clam ×12/side, bodyweight hip thrust ×12. (4–5 min)';

  {id:'b6',pat:'L',tempo:'1010',cue:"Band above the knees, quarter-squat stance, torso leaned forward; small steps, feet never come together, keep tension in the band the whole way",travel:"Same move with the band",blk:['Band lateral walk','Band monster walk (forward and back, diagonal steps)','Band lateral walk, band at the ankles'],sets:3,reps:'12 steps each way',kind:'pump',rest:0,ss:'A',inc:'band',subs:['Band seated abduction','Side-lying hip raise','Hip abduction machine']},
  {id:'b7',pat:'PL',tempo:'2012',cue:"Rope at face height, elbows high and wide, pull to the forehead and finish with the hands apart, 2-s squeeze — posture and rear delts",travel:"Band face pull around a post, or palms-down band pull-apart",name:'Face pull, rope on the lat tower',blk:['Face pull, rope on the lat tower','DB rear-delt fly','Band face pull on the rack'],sets:3,reps:'15–20',kind:'iso',rest:60,ss:'A',inc:'cable',subs:['Band face pull','DB rear-delt fly','Palms-down band pull-apart']},

function slotName(slot,week){const sid=slot.id;if(S.subs[sid])return S.subs[sid];return baseName(slot);}
function curName(slot,sess,w){const e=sess&&sess.entries[slot.id];return e&&e.exercise?e.exercise:slotName(slot,w);}
function isStrengthBlock(){return blockType()===2&&S.level!=='beginner';}
function slotReps(slot,week){if(slot.strength&&isStrengthBlock())return '4–6';if(slot.repsBy&&slot.repsBy[blockType()])return slot.repsBy[blockType()];return slot.reps;}
function restOf(slot){return (slot.strength&&isStrengthBlock())?Math.max(slot.rest||0,150):slot.rest;}
function repsRange(r){const m=r.match(/(\d+)\s*[–-]\s*(\d+)/);return m?[+m[1],+m[2]]:null;}
function fmtDate(s){const d=parse(s);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}

function lastFor(exName,excludeKey,inclOpt){for(const s of sessionsSorted()){if(s.key===excludeKey)continue;if(!inclOpt&&!isMainSess(s))continue;for(const id in s.entries){const e=s.entries[id];if(e.exercise===exName&&e.sets.some(x=>x.w!==''||x.r!==''))return{sets:e.sets,date:s.date,block:s.block||1};}}return null;}

function sessionKey(day,date){return S.program+'-'+day+'-'+date;}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/86400000);}
const INCNUM={barT:10,barL:10,bar:5,cable:5,pin:5,plate:5,kb:5,bw:5};
const EQSTEP={barT:2.5,barL:2.5,bar:2.5,cable:5,pin:5,plate:2.5,kb:5,bw:2.5};
const STARTW={barT:45,barL:45,bar:25,db:10,kb:20,cable:10,pin:10,plate:null,bw:null};
const RIRLOW={comp:[2,2,1],iso:[2,1,0],pump:[1,0,0]};
function dbStep(w){return w>=30?5:2.5;}
function incOf(slot){return slot.incBy?slot.incBy[blockType()]:slot.inc;}
function stepFor(slot,w0){const inc=incOf(slot);return inc==='db'?dbStep(w0||0):(EQSTEP[inc]||0);}

function roundStep(x,step){return Math.round(x/step)*step;}
function progMode(slot){if(slot.kind==='pump')return 'reps';const inc=incOf(slot);if(inc==='barT'||inc==='barL')return stageOf(slot)>=3?'double':'ladder';return stepFor(slot,0)>0?'double':'reps';}
function pkOf(slot){if(slot.pkBy)return slot.pkBy[blockType()];return slot.pk||slot.id;}
function prKey(slot,name){return pkOf(slot)+'|'+name;}
function repsOf(slot,week){const r=slotReps(slot,week);const m=repsRange(r);if(m)return m;const n=parseInt(r);return isNaN(n)?null:[n,n];}
function firstRunRungs(ref,inc,stage){const lad=ladderFor(S.level,ref,inc,stage);const top=lad[lad.length-1];return Array.from({length:5},(_,i)=>+(100+(top-100)*i/4).toFixed(2));}
function isMainSess(s){const P=PROGRAMS[s.prog||'full'];const D=P&&P.days[s.day];return !(D&&D.optional);}
function bestAtFloor(sets,lo){let best=null;for(const x of sets){if(x.r===''||+x.r<lo)continue;const w=x.w===''?0:parseFloat(x.w);if(isNaN(w))continue;if(best===null||w>best)best=w;}return best;}
function logged(sets){return sets.filter(x=>x.r!=='');}
// hit = every prescribed set logged and at the floor; miss = any logged set under the floor; partial = fewer sets than prescribed but all at the floor (neutral)
function result(e,lo){const f=logged(e.sets);const n=e.n||e.sets.length;if(!f.length)return 'partial';if(f.some(x=>+x.r<lo))return 'miss';return f.length>=n?'hit':'partial';}
function history(slot,name,excl,inclOpt){const pk=pkOf(slot);const out=[];for(const s of Object.values(S.sessions)){if(s.key===excl)continue;if(view.date&&s.date>view.date)continue;if(!inclOpt&&!isMainSess(s))continue;for(const id in s.entries){const e=s.entries[id];if((e.pk||id)!==pk||e.exercise!==name)continue;if(!e.sets.some(x=>x.r!==''))continue;out.push({sets:e.sets,n:e.n||e.sets.length,date:s.date,block:s.block||1,key:s.key,done:!!s.done});}}return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);}
function lastFor(exName,excludeKey,inclOpt,slot){if(!slot)return null;const h=history(slot,exName,excludeKey,inclOpt);return h.length?h[h.length-1]:null;}
function validPR(slot,name,lo){const h=history(slot,name,null,false).filter(x=>x.block<S.block);let best=null,bb=0;for(const x of h){const b=bestAtFloor(x.sets,lo);if(b===null)continue;if(x.block>bb||(x.block===bb&&b>best)){bb=x.block;best=b;}}if(best!==null)return{w:best,block:bb};const m=S.prs[prKey(slot,name)];return m?{w:m,block:0,manual:true}:null;}
function resultAt(hist,i,lo,rampFirst){if(rampFirst&&i===0)return bestAtFloor(hist[0].sets,lo)!==null?'hit':'miss';return result(hist[i],lo);}
function missStreak(hist,lo,rampFirst){let n=0;for(let i=hist.length-1;i>=0;i--){const r=resultAt(hist,i,lo,rampFirst);if(r==='miss')n++;else if(r==='hit')break;}return n;}
function rirs(e){return logged(e.sets).map(x=>parseFloat(x.rir)).filter(x=>!isNaN(x));}
function allEasy(e){const f=rirs(e);return f.length&&f.every(x=>x>=3);}
function tooHard(e,slot,week){const f=rirs(e);const low=RIRLOW[slot.kind][phaseIdx(week)];return f.length&&f.some(x=>x<low);}

// the prescription for one slot today

    if(last&&refind){o.ramp=true;o.w=STARTW[incOf(slot)]||0;o.label='Find your starting weight';o.why=`${gap} days since the last session — start light and ramp up like the first time.`;return o;}

    const step=stepFor(slot,ref)||2.5;const wAt=i=>Math.max(step,roundStep(ref*rungs[Math.min(i,rungs.length-1)]/100,step));

  h+=`<div class="row" style="margin:0 0 8px"><div class="seg" style="flex:1;margin:0">${Object.keys(MODES).map(m=>`<button class="${PLAN.mode===m?'on':''}" onclick="App.setMode('${m}')">${MODES[m].label}</button>`).join('')}</div><button class="btn sm ${travelOn?'p':''}" onclick="App.travel(${travelOn?'false':'true'})">${travelOn?'✈︎ Travel on':'✈︎ No gym'}</button><button class="btn sm ${PLAN.circuit?'p':''}" onclick="App.circuit(${PLAN.circuit?'false':'true'})">${PLAN.circuit?'⟳ Circuit on':'⟳ Circuit'}</button></div>`;
  if(PLAN.mode==='quick')h+=`<div class="note" style="margin-top:0">Quick: one set fewer, shorter rests, and the finishers drop. Your main lifts stay.</div>`;
  const warmTxt=(S.level==='beginner'&&S.block===1)?D.warm.replace(ACT,ACT_FULL):D.warm;
  h+=`<details class="warm"><summary><b>Activation (${(S.level==='beginner'&&S.block===1)?'5':'2'} min)</b> — tap</summary>${esc(warmTxt)} Heavy lifts show their own warm-up sets on the card.</details>`;
  const activeIds=PLAN.active.map(s=>s.id);const expanded=view.expand||{};
  const renderSlot=(slot,circ)=>{
    if(!activeIds.includes(slot.id)){const manual=sess&&sess.skip&&sess.skip[slot.id];h+=`<div class="card" style="padding:8px 12px;opacity:.6;display:flex;justify-content:space-between;align-items:center;gap:8px"><div style="font-size:13px"><b>${esc(curName(slot,sess,w))}</b><div class="note" style="margin:0">${manual?'skipped today':'dropped for time'}</div></div><button class="btn sm" onclick="App.unskip('${slot.id}')">Add back</button></div>`;return;}
    const name=curName(slot,sess,w);const reps=slotReps(slot,w);const rng=repsOf(slot,w)||[0,0];const rir=RIR[slot.kind][phaseIdx(w)];const CUE=cueFor(slot,name);
    let nS=effSets(slot,PLAN.mode);const e=sess&&sess.entries[slot.id];const base=e?e.sets:Array.from({length:slot.sets},()=>({w:'',r:'',rir:''}));
    const last=lastFor(name,sess?sess.key:null,!!D.optional,slot);let sg=suggest(slot,name,sess,w);
    if(sg&&D.open&&sg.w!==null&&!sg.ramp){const st=stepFor(slot,sg.w)||2.5;sg.w=Math.max(0,roundStep(sg.w*0.7,st));sg.label=`${sg.w} lb × ${rng[0]===rng[1]?rng[0]:rng[0]+'–'+rng[1]}`;sg.why='Open gym: 70% of your current prescription. '+sg.why;}
    if(sg&&sg.ramp&&sg.mode==='ladder')nS=Math.max(nS,5);if(circ)nS=PLAN.rounds;if(sg)SUGMAP[slot.id]=sg.w;const sets=Array.from({length:nS},(_,i)=>base[i]||{w:'',r:'',rir:''});
    const paired=!circ&&slot.ss&&PLAN.active.some(o=>o!==slot&&o.ss===slot.ss);const effRest=circ?0:Math.round((restOf(slot)||(slot.ss&&!paired?60:0))*MODES[PLAN.mode].rf);RESTMAP[slot.id]=effRest;
    const restTxt=effRest?`rest ${Math.floor(effRest/60)}:${pad(effRest%60)}${paired?' after the pair':''}`:(paired?'straight into the next':'');
    const done=logged(sets).length>=nS;const open=!(view.collapsed&&view.collapsed[slot.id]);
    const tags=[`<span class="tag">${kindLabel(slot)}</span>`,paired?`<span class="tag ss">Pair with next</span>`:'',circ?`<span class="tag" style="color:var(--acc)">Circuit</span>`:'',sg&&sg.ramp?`<span class="tag" style="color:var(--acc2)">First time</span>`:'',slot.strength&&isStrengthBlock()?`<span class="tag" style="color:var(--acc)">Strength block</span>`:'',name!==baseName(slot)?`<span class="tag rot">Swapped${S.subs[slot.id]===name?' (standing)':''}</span>`:'',T&&slot.pat?`<span class="tag vec">${PAT[slot.pat]}</span>`:'',T&&slot.cut?`<span class="tag cut">Cut first</span>`:'',T&&slot.blk?`<span class="tag rot">Block ${BLKNAME[blockType()]}</span>`:'',sg&&sg.flag?`<span class="tag cut">Flag for trainer</span>`:''].join('');
    if(!open){h+=`<div class="card" data-slot="${slot.id}" style="padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px" onclick="App.expand('${slot.id}')"><div style="font-size:14px"><b>✓ ${esc(name)}</b><div class="note" style="margin:0">${esc(fmtSets(sets))}</div></div><span class="note">edit</span></div>`;return;}
    const pre=(sg&&sg.w!==null&&!sg.ramp)?String(sg.w):'';
    const rirSel=(v,i)=>T?`<input type="number" inputmode="numeric" placeholder="${rir}" value="${esc(v)}" oninput="App.setVal('${slot.id}',${i},'rir',this.value)">`:`<select onchange="App.setVal('${slot.id}',${i},'rir',this.value)" style="padding:8px 2px;font-size:13px"><option value="">felt…</option><option value="3" ${v==='3'?'selected':''}>easy</option><option value="2" ${v==='2'||v==='1'?'selected':''}>right</option><option value="0" ${v==='0'?'selected':''}>hard</option></select>`;
    h+=`<div class="card" data-slot="${slot.id}">
      <div class="ex-head"><div><div class="ex-name">${esc(name)}</div><div class="ex-meta">${circ?nS+' rounds':nS+' sets'} × ${esc(reps)}${slot.perLeg?' per side':''}${restTxt?' · '+restTxt:''}${T?' · RIR '+rir:''}</div><div style="margin-top:4px">${tags}</div></div>
      <div style="display:flex;flex-direction:column;gap:6px"><button class="btn sm" onclick="App.openSub('${slot.id}')">Swap</button><button class="btn sm" onclick="App.how('${slot.id}')">How</button></div></div>
      <div id="how-${slot.id}" class="ex-meta" style="display:none;font-style:italic;margin:6px 0">${esc(CUE.cue||'')}${CUE.tempo?`<div style="font-style:normal;margin-top:4px">Tempo: ${esc(tempoWords(CUE.tempo))}</div>`:''}</div>
      ${sg?`<div class="hint" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span><b>${sg.ramp?esc(sg.label):'Suggested '+esc(sg.label)}</b>${sg.repsTarget?'':''}</span><button class="btn sm" style="padding:4px 9px" onclick="App.why('${slot.id}')">ⓘ</button></div><div id="why-${slot.id}" class="note" style="display:none;margin-top:0">${esc(sg.why)}${T&&sg.mode?' <span class="mut">('+sg.mode+')</span>':''}</div>`:''}
      ${(()=>{const wu=warmupFor(slot,sg);return wu?`<div class="ex-meta" style="margin:2px 0 4px">Warm-up: ${wu.join(' → ')} <span class="mut">(not logged)</span></div>`:'';})()}
      <div class="last">Last time: <b>${last?fmtSets(last.sets):'no log yet'}</b>${last?' · '+fmtDate(last.date):''}</div>
      ${sg&&(sg.w!==null||sg.mode==='reps')&&!sg.ramp&&!(sess&&sess.done)&&!logged(sets).length?`<div class="row" style="margin:0 0 4px"><button class="btn sm p" onclick="App.accept('${slot.id}',true)">✓ Did it as written</button></div>`:''}
      <div class="sets"><span class="h">Set</span><span class="h">Load used</span><span class="h">Reps</span><span class="h">${T?'RIR':'Felt'}</span>
      ${sets.map((s,i)=>`<span class="n">${i+1}</span><input type="number" inputmode="decimal" data-i="${i}" data-f="w" class="${s.w===''&&pre!==''?'pre':''}" placeholder="${pre!==''?pre:(sg&&sg.ramp?esc(sg.w??''):(last&&last.sets[i]?esc(last.sets[i].w):''))}" value="${s.w!==''?esc(s.w):(i===0||s.r!==''?pre:'')}" oninput="App.setVal('${slot.id}',${i},'w',this.value)"><input type="number" inputmode="numeric" data-i="${i}" data-f="r" placeholder="${sg&&sg.repsTarget?sg.repsTarget:(rng[0]===rng[1]?rng[0]:rng[0]+'–'+rng[1])}" value="${esc(s.r)}" onchange="App.setVal('${slot.id}',${i},'r',this.value)">${rirSel(s.rir,i)}`).join('')}
      </div>
      <div class="row">${effRest?`<button class="btn" onclick="App.timerStart(${effRest})">⏱ Rest ${restTxt.replace('rest ','').replace(' after the pair','')}</button>`:''}<button class="btn sm" onclick="App.copyLast('${slot.id}')" ${last?'':'disabled'}>Copy last</button>${done?`<button class="btn sm" onclick="App.collapse('${slot.id}')">Done ✓</button>`:''}</div>
    </div>`;
  };
  if(!PLAN.circuit){D.slots.forEach(s=>renderSlot(s,false));}
  else{const hv=D.slots.filter(s=>!activeIds.includes(s.id)||isHeavy(s));const cs=D.slots.filter(s=>activeIds.includes(s.id)&&!isHeavy(s));
    hv.forEach(s=>renderSlot(s,false));
    if(cs.length){h+=`<div class="card" style="border-color:var(--acc)"><div class="ex-name" style="color:var(--acc)">⟳ Circuit · ${PLAN.rounds} rounds</div><div class="ex-meta">${cs.map(s=>esc(curName(s,sess,w))).join(' → ')}</div><div class="ex-meta" style="margin-top:4px">Straight from one to the next, ~50 s each; rest 1:15 after a full round. Log one row per round. Keep the loads honest — all out on round 1 is a bad round 3.</div><div class="row"><button class="btn p" onclick="App.timerStart(75)">⏱ Rest between rounds 1:15</button></div></div>`;cs.forEach(s=>renderSlot(s,true));}}
  if(!D.optional)h+=`<div class="note" style="margin:4px 2px 8px"><b>10 minutes free.</b> Anything you like to finish — a favorite from the Pump day, extra band work, a stretch. Log it under the Pump day if you want it tracked.</div>`;
  h+=`<div class="row"><button class="btn g" onclick="App.finish()">${sess&&sess.done?'Update workout':'Finish workout'}</button></div>
  <div class="row"><input type="date" id="datePick" value="${view.date}" style="text-align:left;font-size:14px" onchange="App.setDate(this.value)"></div>`;
  main.appendChild(el(h));
}

function renderProgram(main){const T=!!S.trainer;
  let h=`<h2>How it works</h2><div class="card"><p class="note" style="margin-top:0">Every workout runs the same patterns in the same order: <b>Thrust</b> (hip thrust or bridge — the glute driver, every session) → <b>Hinge</b> → <b>Knee</b> (lunge or step-up, kept light) → <b>Push</b> → <b>Pull</b> → <b>Lateral</b> (abduction, band walks) → <b>Core</b> → <b>Pump</b>. Glutes first, with the thrust and the hinge as the lifts that get strong; everything else supports.</p>
  <p class="note">Not in the program: back squats, leg press, leg extensions. The knee slot is two light sets of the glute-biased version — it limits direct quad work, it doesn't remove it. Core is anti-rotation and anti-extension (no loaded side bends or twists). Arms are two short supersets a round.</p></div>`;
  h+=`<h2>Sessions, not weeks</h2><div class="card"><p class="note" style="margin-top:0"><b>${PROGRAMS[S.program].label}</b> — ${PROGRAMS[S.program].desc}</p><p class="note">Workouts run in order, whatever the calendar says — ${MAIN.length>1?'all '+MAIN.length+' finished = one round':'each session is a round'}; six rounds = a block of ${totalMain()}. Miss a week and nothing breaks: the next session is the next one in order. Extra session in a week: do the next one in order (never two in a day), or use Open gym, Home or Pump day, which log but don't count. When a block is done, take a week light before the next one.</p><table><tr><th>Round</th><th>Phase</th><th>Effort</th></tr>
  <tr><td>1–2</td><td>Activation</td><td>Stop with 2–3 good reps left</td></tr>
  <tr><td>3–4</td><td>Hypertrophy</td><td>Stop with 1–2 left</td></tr>
  <tr><td>5–6</td><td>Pump &amp; Peak</td><td>Main lifts 1–2 left; accessories to the last clean rep</td></tr></table></div>`;
  h+=`<h2>Blocks A → B → C</h2><div class="card"><p class="note" style="margin-top:0">The barbell hip thrust and the barbell RDL stay in every block and climb continuously. Everything else changes lift by block so the pattern stays and the exercise rotates. <b>Block C is the strength block</b> for Intermediate and Advanced: the thrust and RDL run 4–6 reps with longer rests (heavier numbers off the same best); Beginners stay at 6–10. Now in <b>Block ${BLKNAME[blockType()]}</b>${isStrengthBlock()?' — strength block':''}.</p>`;
  if(T){h+=`<table><tr><th>Slot</th><th>Block A</th><th>Block B</th><th>Block C</th></tr>`;for(const d of MAIN)for(const s of DAYS[d].slots)h+=`<tr><td>W${DAYLABEL[d]} ${PAT[s.pat]||''}</td>${(s.blk||[s.name,s.name,s.name]).map((n,i)=>`<td ${i===blockType()?'style="color:var(--acc)"':''}>${esc(n)}</td>`).join('')}</tr>`;h+=`</table>`;}
  h+=`</div>`;
  h+=`<h2>How the weights are chosen</h2><div class="card"><p class="note" style="margin-top:0">Each exercise shows a <b>suggested</b> load and rep range; tap ⓘ to see why. First time on a lift: start light and go up a step every set you hit the rep floor — the heaviest set that does becomes your starting point. Barbell lifts then climb a ladder across the block${T?(LV().fixed?' (Advanced: fixed load, 90% of best up to best +10 lb)':` (${LV().label}: ${ladderFor(S.level).join(' · ')}% of the lift's PR; first run 100 → ${ladderFor(S.level).slice(-1)[0]}%)`):''}. Dumbbell, cable and machine work goes up a step once every set hits the top of the range. Advanced lifters who stop setting bests on the thrust or RDL move through smaller steps (+5, then +2.5) and then rep PRs at the held load — the bar number flattens on purpose; progress is reps, tempo and the accessories. What counts: an exercise counts once every prescribed set has reps logged, even if you forgot to tap Finish; fewer sets logged is neutral. The load in the box is the load you're confirming when you enter reps — change it if you used something else. Miss the rep floor: repeat. Miss twice: down a step. Three times: tell your trainer. Mark a set <b>easy</b> and the next one goes up; mark it <b>hard</b> and it holds.</p>${T?`<ol class="ol">${RULES.map(r=>`<li>${esc(r)}</li>`).join('')}</ol>`:''}</div>`;
  h+=`<h2>Warm-up</h2><div class="card"><p class="note" style="margin:0">Two minutes of activation (abduction, bridge), then the heavy lifts show their own warm-up sets on the card, scaled to the day's working load — bar × 8, ~60% × 5, ~80% × 3 on a barbell lift; one lighter set on a dumbbell lift; nothing when the working load is light. Accessories and the circuit don't need one; the first set is the warm-up. First time on a lift, the ramp is the warm-up. Beginners get a fuller activation in block 1.</p></div>
  <h2>Short on time</h2><div class="card"><p class="note" style="margin:0"><b>Circuit</b> (on by default; Settings): the heavy lifts stay as straight sets with full rest, then everything after them runs as one circuit — knee, laterals, abduction, arms, core, pump — 2–3 rounds, straight through, 1:15 between rounds. The burn suits the accessory work; it never touches the heavy slots. <b>Quick</b> takes one set off everything, shortens rests, and drops the finishers first — the thrust, hinge and main press/pull always stay. Dropped exercises can be added back. Any exercise can be skipped for the day from Swap.</p></div>`;
  h+=`<h2>Outside the gym</h2><div class="card"><ul class="ol"><li>Band seated abduction 1 × 30 on non-training days</li><li>After long sitting: stand, tuck the pelvis, 10 × 2-s glute squeezes</li><li>Eat enough. The surplus is the raw material; the thrust is just the signal.</li></ul></div>`;
  main.appendChild(el(h));
}

function renderHistory(main){
  const names=new Set();for(const s of Object.values(S.sessions))for(const id in s.entries){const e=s.entries[id];if(e.sets.some(x=>x.w!==''||x.r!==''))names.add(e.exercise);}
  const list=[...names].sort();
  let h=`<h2>By exercise</h2>`;
  if(!list.length){h+=`<p class="note">Nothing logged yet.</p>`;main.appendChild(el(h));return;}
  h+=`<select id="hx" onchange="App.hxPick(this.value)"><option value="">Pick an exercise…</option>${list.map(n=>`<option ${view.hx===n?'selected':''}>${esc(n)}</option>`).join('')}</select><div id="hxout"></div>`;
  h+=`<h2>Sessions</h2><div class="card"><table><tr><th>Date</th><th>Workout</th><th>Blk·Rd</th><th>Sets logged</th></tr>${sessionsSorted().map(s=>{const n=Object.values(s.entries).reduce((a,e)=>a+e.sets.filter(x=>x.w!==''||x.r!=='').length,0);return`<tr><td>${fmtDate(s.date)}</td><td>${PROGRAMS[s.prog||'full'].label.slice(0,5)} · ${dayOf(s).optional?'':'W'+labOf(s)+' '}${dayOf(s).name.replace(' (optional)','')}</td><td>${s.block||1}·${s.week}${s.mins?'<div class="mut">'+s.mins+' min</div>':''}</td><td>${n}${s.done?' ✓':' <span style="color:var(--acc)">unfinished</span>'}${s.flags&&s.flags.length?` <span style="color:var(--red)">⚑ ${esc(s.flags.join(', '))}</span>`:''} <a href="#today" onclick="App.openSession('${s.key}')" style="color:var(--blue)">open</a> · <a href="#history" onclick="App.delSessionYes('${s.key}')" style="color:var(--red)">delete</a></td></tr>`;}).join('')}</table></div>`;
  main.appendChild(el(h));if(view.hx)App.hxPick(view.hx);
}
App.hxPick=n=>{view.hx=n;const out=document.getElementById('hxout');if(!n){out.innerHTML='';return;}
  const rows=[];for(const s of sessionsSorted())for(const id in s.entries){const e=s.entries[id];if(e.exercise===n&&e.sets.some(x=>x.w!==''||x.r!==''))rows.push(`<tr><td>${fmtDate(s.date)}</td><td>rd ${s.week}</td><td>${esc(fmtSets(e.sets))}</td><td>${e.sets.map(x=>x.rir).filter(x=>x!=='').join(',')||'—'}</td></tr>`);}
  out.innerHTML=`<div class="card" style="margin-top:10px"><table><tr><th>Date</th><th>Round</th><th>Load × reps</th><th>RIR</th></tr>${rows.join('')}</table></div>`;};

function renderSettings(main){const T=!!S.trainer;
  let h=`<h2>Who's using this</h2><div class="card"><div class="seg" style="margin-top:0"><button class="${!T?'on':''}" onclick="App.setTrainer(false)">Client view</button><button class="${T?'on':''}" onclick="App.setTrainer(true)">Trainer view</button></div><p class="note" style="margin-top:0">Client view shows the workout, suggested loads, "last time", swaps and technique. Trainer view adds the pattern tags, tempo codes, RIR numbers, the block table, the ladder editor and block control.${S.pin?' Trainer view is PIN-protected.':''}</p>${T?`<div class="row"><input type="password" inputmode="numeric" id="pinIn" placeholder="${S.pin?'PIN set — enter a new one':'4-digit PIN for trainer view'}"><button class="btn sm" onclick="App.setPin(document.getElementById('pinIn').value)">Set</button>${S.pin?`<button class="btn sm" onclick="App.setPin('')">Clear</button>`:''}</div>`:''}</div>`;
  if(T){const cl=clientList();h+=`<h2>Client on this phone</h2><div class="card"><p class="note" style="margin-top:0">Now: <b>${esc(CLIENT)}</b>. Each client has her own logs, program, level and block on this phone. Switching reloads the app.</p>${cl.map(c=>`<div class="row" style="margin-top:6px;align-items:center"><button class="btn ${c===CLIENT?'p':''}" onclick="App.setClient(${JSON.stringify(c).replace(/"/g,'&quot;')})">${esc(c)}</button>${c!=='Blake'&&c!==CLIENT?`<button class="btn sm danger" onclick="App.removeClient(${JSON.stringify(c).replace(/"/g,'&quot;')})">Remove</button>`:''}</div>`).join('')}<div class="row"><input type="text" id="clientIn" placeholder="New client name" style="text-align:left"><button class="btn sm p" onclick="App.setClient(document.getElementById('clientIn').value)">Add &amp; switch</button></div></div>`;}
  h+=`<h2>Circuit the back half</h2><div class="card"><div class="seg" style="margin-top:0"><button class="${S.circuitDefault?'on':''}" onclick="App.setCircuitDefault(true)">On by default</button><button class="${!S.circuitDefault?'on':''}" onclick="App.setCircuitDefault(false)">Off by default</button></div><p class="note" style="margin-top:0">After the heavy lifts (thrust, hinge, main press and pull — straight sets with full rest), the rest of the workout runs as one circuit: 2–3 rounds, straight through, 1:15 between rounds. The button on each workout overrides it for that day.</p></div><h2>Program</h2><div class="card"><div class="seg" style="margin-top:0">${Object.keys(PROGRAMS).map(k=>`<button class="${S.program===k?'on':''}" onclick="App.setProgram('${k}')">${PROGRAMS[k].label}<br><span style="font-size:11px;font-weight:400">${PROGRAMS[k].when}</span></button>`).join('')}</div><p class="note" style="margin-top:0">${PROGRAMS[S.program].desc}</p><p class="note">Each program keeps its own round count; the block (A/B/C) is shared. An exercise keeps its history across programs when it's the same exercise — the barbell hip thrust and RDL always, and any accessory that appears by the same name in both.</p></div>`;
  h+=`<h2>Level</h2><div class="card"><div class="seg" style="margin-top:0">${Object.keys(LEVELS).map(k=>`<button class="${S.level===k?'on':''}" onclick="App.setLevel('${k}')">${LEVELS[k].label}</button>`).join('')}</div><p class="note" style="margin-top:0">${LV().desc}</p><p class="note">Ladders apply to the barbell thrust, bridge and RDL only. Beginner, block 1 only: one set off every 3–4-set lift (thrust and RDL keep three) and no finishers in rounds 1–2. When the thrust or RDL misses three sessions in each of two blocks running, the next block start recommends the gentler ladder.</p>${LV().fixed?`<p class="note"><b>Plateau stages (Advanced).</b> Each block that ends without a new best moves that lift one stage: +10 → +5 → +2.5 → rep PRs at the held load → rep PRs plus a variant-rotation suggestion. A new best keeps the stage. The strength block (C, 4–6 reps) doesn't move stages — its loads aren't comparable to 6–10 bests.</p>${T?['thrust','rdl'].map(pk=>{const P=plateauOf(pk);return `<div class="row" style="margin-top:4px;align-items:center"><div style="flex:1;font-size:13px"><b>${pk==='thrust'?'Hip thrust':'RDL'}</b>: stage ${P.stage} — ${STAGENAME[P.stage]}${P.lastBest!==null?' · best '+P.lastBest:''}</div>${P.stage||P.lastBest!==null?`<button class="btn sm" onclick="App.resetPlateau('${pk}')">Reset</button>`:''}</div>`;}).join(''):''}`:''}${T&&!LV().fixed?`<div class="row" style="margin-top:4px"><input type="text" id="lad" value="${ladderFor(S.level).join(', ')}" style="text-align:left;font-size:14px"><button class="btn sm" onclick="App.setLadder(document.getElementById('lad').value)">Save</button><button class="btn sm" onclick="App.setLadder('')">Default</button></div><p class="note">Six percentages, barbell lifts only. Dumbbell and cable slots use add-reps-then-add-load regardless.</p>`:''}</div>`;
  h+=`<h2>Block</h2><div class="card"><p class="note" style="margin-top:0">Block ${S.block} = Block <b>${BLKNAME[blockType()]}</b> (A → B → C → A…). ${doneMain().length} of ${totalMain()} workouts done · round ${currentWeek()} · next up ${DAYS[nextDay()].name}. A workout counts once you tap Finish. Finish fills any card you didn\'t touch with its grey numbers — the suggested load at the target reps — so a workout done exactly as written is one tap and a confirm. Change anything you did differently before you tap it.</p>${T?`<div class="row"><button class="btn ${doneMain().length>=totalMain()?'p':''}" onclick="App.nextBlock()">Start block ${S.block+1}</button></div><p class="note">Round goes back to 1, the rotating slots switch to Block ${BLKNAME[blockType(S.block+1)]}'s lifts, standing swaps are cleared, every log stays. The thrust and RDL keep climbing off their PR from this block.</p>`:`<p class="note">${doneMain().length>=totalMain()?'Block done — your trainer starts the next one.':''}</p>`}</div>`;
  const subs=Object.keys(S.subs);
  h+=`<h2>Standing swaps</h2><div class="card">${subs.length?subs.map(id=>{const sl=findSlot(id);if(!sl)return '';return`<div class="row" style="margin-top:6px;align-items:center"><div style="flex:1;font-size:14px"><b>${esc(S.subs[id])}</b><div class="note" style="margin:0">for ${esc(baseName(sl))}</div></div><button class="btn sm" onclick="App.clearSub('${id}')">Reset</button></div>`;}).join(''):'<p class="note">None. Use Swap on any exercise.</p>'}</div>`;
  if(T)h+=`<h2>Equipment</h2><div class="card"><p class="note" style="margin:0">Assumes: hip thrust station with bar pad, hip abduction machine, GHR bench, rack with chin-up bar, adjustable bench, Olympic bar, EZ bar, trap bar, plates to 1.25 lb, DBs 2.5–60 (2.5 steps to 30, then 5), kettlebells, lat tower with high and low pulley, landmine, loop and mini bands, ab mat, step plate. No leg press, leg extension or dual cable stack.</p></div><h2>Travel</h2><div class="card"><p class="note" style="margin:0">Every exercise has a no-gym version (bodyweight, band, backpack, couch for thrusts). "No gym today" swaps all of them for that session. Pack a loop band and a mini band.</p></div><h2>Running clients from this phone</h2><div class="card"><p class="note" style="margin-top:0">The roster above keeps a separate log per client on <b>this phone</b>. It's for a trainer-held device: a client on her own phone has her own local copy, and there's no shared account behind either — the Claude sync only works inside a Claude artifact for the account that opens it. The PIN is a speed bump, not a lock; it lives in this phone's storage and in the backup. For client-on-her-own-phone use, the backup paste is how numbers move between devices. A real multi-client version needs a hosted store and a trainer list — a separate build.</p><p class="note">The program data is one file: <b>FULL_DAYS / SPLIT_DAYS / ONCE_DAYS / TWICE_DAYS</b> near the top, registered in <b>PROGRAMS</b>. Each slot has a name or a Block A/B/C list, sets, reps, rest, tempo, cue, travel sub, subs, and what the load goes up in.</p></div>`;
  h+=`<h2>Add to home screen</h2><div class="card"><p class="note">iPhone: Safari → Share → "Add to Home Screen". Android: Chrome menu → "Add to Home screen". Numbers save in the browser you open this in. Signed in to Claude, they also save to your own account and follow you between browsers and phones — the chip at the top shows which. Not signed in: stick to one icon, and use Backup now and then.</p></div>`;
  h+=`<h2>Backup</h2><div class="card"><div class="row"><button class="btn" onclick="App.exportJSON()">Copy backup to clipboard</button></div><textarea id="imp" placeholder="Paste a backup here to restore"></textarea><div class="row"><button class="btn" onclick="App.importJSON()">Restore from paste</button>${T?`<button class="btn danger" onclick="App.wipe()">Erase all logs</button>`:''}</div><p class="note" id="bkmsg"></p></div>`;
  main.appendChild(el(h));
}
function findSlot(id){for(const d of DAYORDER)for(const s of DAYS[d].slots)if(s.id===id)return s;}

// ---------- ACTIONS ----------
App.setDay=d=>{view.day=d;view.date=iso(today());view.resumed=null;render();};
App.circuit=on=>{const sess=getSession(view.day,view.date,true);sess.circuit=on;save();render();};
App.setLevel=k=>{if(!LEVELS[k])return;S.level=k;save();render();};
App.setPR=(key,v)=>{const w=parseFloat(v);if(isNaN(w)||w<=0)delete S.prs[key];else S.prs[key]=w;save();App.closeSheet();render();};
App.setLadder=v=>{const arr=v.split(/[,\s]+/).map(Number).filter(x=>x>0);if(arr.length!==6||arr.some((x,i)=>i&&x<arr[i-1])){if(!arr.length)delete S.ladders[S.level];else{alert('Enter six percentages, lowest to highest.');return;}}else S.ladders[S.level]=arr;save();render();};
App.nextBlock=()=>{const promo=levelPromotion();const pl=plateauPreview();openSheet(`<h3>Start block ${S.block+1}?</h3>${pl.map(x=>`<p class="note" style="border-left:3px solid var(--acc2);padding-left:8px">${esc(x.msg)}</p>`).join('')}<p class="note">Round goes back to 1 and the rotating slots switch to Block ${BLKNAME[blockType(S.block+1)]}'s lifts. Standing swaps are cleared; every log stays. The thrust and RDL keep climbing off this block's best. If the block was hard, make the first week light.</p>${promo?`<p class="note" style="border-left:3px solid var(--acc);padding-left:8px">${promo.msg} This is a recommendation — the level name is about the ladder's steepness, not the client's experience.</p><div class="row"><button class="btn" onclick="App.closeSheet()">Not yet</button><button class="btn" onclick="App.nextBlockYes(false)">Start, keep ${LV().label}</button><button class="btn p" onclick="App.nextBlockYes(true)">Start as ${LEVELS[promo.to].label}</button></div>`:`<div class="row"><button class="btn" onclick="App.closeSheet()">Not yet</button><button class="btn p" onclick="App.nextBlockYes(false)">Start</button></div>`}`);};
App.nextBlockYes=(apply)=>{const promo=levelPromotion();if(promo&&apply)S.level=promo.to;for(const x of plateauPreview()){S.plateau[x.pk]={stage:x.stage,lastBest:x.best};}S.block=(S.block||1)+1;S.subs={};view.day=null;view.collapsed={};save();App.closeSheet();render();};
function anchorMisses(block,pk){let m=0;for(const s of Object.values(S.sessions)){if((s.block||1)!==block||!isMainSess(s))continue;for(const id in s.entries){const e=s.entries[id];if(e.pk!==pk)continue;const sl=findSlotAny(id);const rng=sl?repsOf(sl,1):null;if(rng&&result(e,rng[0])==='miss')m++;}}return m;}
function levelPromotion(){const order=['beginner','intermediate','advanced'];const i=order.indexOf(S.level);if(i<0||i>=2||S.block<2)return null;for(const pk of ['thrust','rdl']){if(anchorMisses(S.block,pk)>=3&&anchorMisses(S.block-1,pk)>=3)return{to:order[i+1],msg:`The ${pk==='thrust'?'hip thrust':'RDL'} missed three or more sessions in each of the last two blocks — the ${LEVELS[S.level].label} ladder looks too steep for this lift. Suggest the ${LEVELS[order[i+1]].label} ladder (smaller steps) for the next block.`};}return null;}
App.setMode=m=>{const sess=getSession(view.day,view.date,true);sess.mode=MODES[m]?m:'full';sess.keep={};save();render();};
App.skip=sid=>{const sess=getSession(view.day,view.date,true);sess.skip=sess.skip||{};sess.skip[sid]=true;save();App.closeSheet();render();};
App.unskip=sid=>{const sess=getSession(view.day,view.date,true);if(sess.skip)delete sess.skip[sid];sess.keep=sess.keep||{};sess.keep[sid]=true;save();render();};
App.setProgram=k=>{if(!PROGRAMS[k]||k===S.program)return;const n=doneMain().length;if(n>0&&n<totalMain()){openSheet(`<h3>Switch to ${PROGRAMS[k].label}?</h3><p class="note">This block is ${n}/${totalMain()} done in ${PROGRAMS[S.program].label}. The new program starts its own round count (Block ${S.block} stays). Exercise history carries over by slot, so suggested weights continue where they are.</p><div class="row"><button class="btn" onclick="App.closeSheet()">Stay</button><button class="btn p" onclick="App.setProgramYes('${k}')">Switch</button></div>`);return;}App.setProgramYes(k);};
App.setProgramYes=k=>{S.program=k;applyProgram();view.day=null;view.collapsed={};save();App.closeSheet();render();};
App.setDate=s=>{if(/^\d{4}-\d{2}-\d{2}$/.test(s)){view.date=s;view.resumed=null;render();}};
App.openSession=k=>{const s=S.sessions[k];if((s.prog||'full')!==S.program){S.program=s.prog||'full';applyProgram();save();}view.day=s.day;view.date=s.date;view.resumed=null;location.hash='#today';render();};
App.setVal=(sid,i,f,v)=>{const sess=getSession(view.day,view.date,true);const slot=findSlot(sid);const name=curName(slot,sess,sess.week);const card=document.querySelector(`[data-slot="${sid}"]`);
  if(!sess.entries[sid])sess.entries[sid]=newEntry(slot,name,sess);
  sess.u=Date.now();const ss=sess.entries[sid].sets;while(ss.length<=i)ss.push({w:'',r:'',rir:''});ss[i][f]=v;
  if(!sess.startedAt&&v!=='')sess.startedAt=Date.now();
  if(f==='r'&&v!==''){const wi=card&&card.querySelector(`input[data-i="${i}"][data-f="w"]`);
    if(ss[i].w===''&&wi&&wi.value!==''){ss[i].w=wi.value;wi.classList.remove('pre');}// the weight she saw in the box is the weight she confirms
    const rng=repsOf(slot,sess.week);const w=ss[i].w===''?NaN:parseFloat(ss[i].w);const sg=suggest(slot,name,sess,sess.week);
    if(sg&&sg.ramp&&rng&&!isNaN(w)&&+v>=rng[0]&&ss[i+1]&&ss[i+1].w===''){const easy=parseFloat(ss[i].rir)>=3;const nw=w+rampStep(slot,w,easy);ss[i+1].w=String(nw);const inp=card&&card.querySelector(`input[data-i="${i+1}"][data-f="w"]`);if(inp){inp.value=nw;inp.classList.remove('pre');}}
    else if(ss[i+1]&&ss[i+1].w===''&&!isNaN(w)){const inp=card&&card.querySelector(`input[data-i="${i+1}"][data-f="w"]`);if(inp&&inp.value===''){inp.value=String(w);inp.classList.add('pre');}}
    if(RESTMAP[sid])App.timerStart(RESTMAP[sid]);}
  if(f==='rir'&&v!==''&&parseFloat(v)>=3&&ss[i+1]&&ss[i]&&ss[i].r!==''){const sg=suggest(slot,name,sess,sess.week);const rng=repsOf(slot,sess.week);const w=parseFloat(ss[i].w);if(sg&&sg.ramp&&rng&&!isNaN(w)&&+ss[i].r>=rng[0]){const nw=w+rampStep(slot,w,true);ss[i+1].w=String(nw);const inp=card&&card.querySelector(`input[data-i="${i+1}"][data-f="w"]`);if(inp)inp.value=nw;}}
  save();};
// Fill one card from its grey suggestion: load on every set, reps at the target (top of range / strength target). Returns true if filled.
function acceptCard(sess,slot,withReps){const name=curName(slot,sess,sess.week);const sg=suggest(slot,name,sess,sess.week);if(!sg||sg.ramp)return false;let w=sg.w;if(w===null){if(sg.mode!=='reps')return false;const last=lastFor(name,sess.key,false,slot);w=last&&last.sets[0]?last.sets[0].w:'';}const rng=repsOf(slot,sess.week);const r=sg.repsTarget?String(sg.repsTarget):(rng?String(rng[1]):'');const e=newEntry(slot,name,sess);e.sets=e.sets.map((x,i)=>i<e.n?{w:String(w),r:withReps?r:'',rir:''}:x);e.auto=withReps;sess.entries[slot.id]=e;return true;}
App.accept=(sid,withReps)=>{const sess=getSession(view.day,view.date,true);const slot=findSlot(sid);if(!sess.startedAt)sess.startedAt=Date.now();if(acceptCard(sess,slot,withReps)){sess.u=Date.now();save();render();}};
App.more=()=>{view.more=true;render();};
App.finishKey=k=>{const s=S.sessions[k];if(!s)return;s.done=true;save();render();};
App.expand=sid=>{view.collapsed=view.collapsed||{};delete view.collapsed[sid];render();};
App.collapse=sid=>{view.collapsed=view.collapsed||{};view.collapsed[sid]=true;render();};
App.how=sid=>{const el=document.getElementById('how-'+sid);if(el)el.style.display=el.style.display==='none'?'block':'none';};
App.why=sid=>{const el=document.getElementById('why-'+sid);if(el)el.style.display=el.style.display==='none'?'block':'none';};
App.resetPlateau=pk=>{if(S.plateau)delete S.plateau[pk];save();render();};
App.syncHelp=()=>{openSheet(`<h3>Keeping your numbers</h3><p class="note">This page saves to the browser it's open in. On an iPhone, Safari, the home-screen icon, the Claude app and a link opened from Messages are each a <b>separate</b> place — numbers logged in one won't show in another.</p><p class="note"><b>The fix:</b> sign in to Claude (a free account works) in the browser you use for workouts, then open this link there. Signed in, every set saves to your own account and follows you anywhere you open the link. The chip at the top turns green: <span class="sync ok" style="float:none">✓ account</span>.</p><p class="note">Until then, use one place only — the same icon every time — and copy a backup from Settings now and then.</p><div class="row"><button class="btn p" onclick="App.closeSheet()">Got it</button></div>`);};
App.setCircuitDefault=on=>{S.circuitDefault=!!on;save();render();};
App.setTrainer=on=>{if(on&&S.pin){const p=prompt('Trainer PIN');if(p!==S.pin)return;}S.trainer=!!on;save();render();};
App.setPin=v=>{v=(v||'').trim();if(v&&!/^\d{4}$/.test(v)){alert('Four digits.');return;}S.pin=v||'';save();render();};
App.setClient=name=>{name=(name||'').trim();if(!name)return;const list=clientList();if(!list.includes(name)){list.push(name);saveClients(list);}try{localStorage.setItem('peach-barn-current',name);}catch(e){}location.reload();};
App.removeClient=name=>{if(name==='Blake')return;if(!confirm('Remove '+name+' from the list? Logs stay on this phone unless erased.'))return;saveClients(clientList().filter(x=>x!==name));render();};
App.copyLast=sid=>{const sess=getSession(view.day,view.date,true);const slot=findSlot(sid);const name=curName(slot,sess,sess.week);const last=lastFor(name,sess.key,!!DAYS[view.day].optional,slot);if(!last)return;
  const ne=newEntry(slot,name,sess);ne.sets=last.sets.map(x=>({w:x.w,r:x.r,rir:''}));sess.entries[sid]=ne;save();render();};
App.travel=on=>{const sess=getSession(view.day,view.date,true);const D=DAYS[view.day];D.slots.forEach(sl=>{const base=slotName(sl,sess.week);const target=on?sl.travel:base;const e=sess.entries[sl.id];if(!e||e.exercise!==target){const ne=newEntry(sl,target,sess);ne.n=effSets(sl,sess.mode||'full');ne.sets=ne.sets.slice(0,Math.max(ne.n,sl.sets));sess.entries[sl.id]=ne;}});save();render();};
App.finish=(force)=>{const sess=getSession(view.day,view.date,true);if(!force&&!sess.done&&!Object.values(sess.entries).some(e=>e.sets.some(x=>x.r!==''))){const P=plan(DAYS[sess.day],sess);const names=P.active.map(sl=>{const nm=curName(sl,sess,sess.week);const sg=suggest(sl,nm,sess,sess.week);return sg&&sg.ramp?null:nm;}).filter(Boolean);openSheet(`<h3>Nothing typed yet</h3><p class="note">Finish with all the recommended loads and reps — the grey numbers on every card — as what you did today?</p><p class="note">${esc(names.join(' · '))||'Nothing has a recommendation yet'}</p>${names.length<P.active.length?`<p class="note">First-time lifts stay blank — those need the ramp sets typed.</p>`:''}<div class="row"><button class="btn" onclick="App.closeSheet()">Go back</button>${names.length?`<button class="btn p" onclick="App.closeSheet();App.finish(true)">Finish as written</button>`:''}</div>`);return;}const was=sess.done;if(!sess.startedAt)sess.startedAt=Date.now();let filled=[];if(!was){const P=plan(DAYS[sess.day],sess);P.active.forEach(sl=>{const e=sess.entries[sl.id];if(e&&e.sets.some(x=>x.r!==''))return;if(acceptCard(sess,sl,true))filled.push(curName(sl,sess,sess.week));});}sess.done=true;sess.u=Date.now();if(!was&&sess.startedAt){const m=Math.round((Date.now()-sess.startedAt)/60000);if(m>=10&&m<=180)sess.mins=m;}view.collapsed={};sess.flags=[];App.timerStop();const D=DAYS[sess.day];D.slots.forEach(sl=>{const nm=curName(sl,sess,sess.week);const sg=suggest(sl,nm,null,sess.week);if(sg&&sg.flag)sess.flags.push(nm);});save();if(!was&&MAIN.includes(sess.day)){const n=doneMain().length;const w=currentWeek();const closed=n%perRound()===0&&n<totalMain();view.flash=(closed?`✓ ${DAYS[sess.day].name} logged — that closes Round ${w-1}. Round ${w} (${PHASES[w]}) starts; loads come off your Round ${w-1} numbers.`:n>=totalMain()?`✓ All ${totalMain()} workouts done.`:`✓ ${DAYS[sess.day].name} logged (${n}/${totalMain()}). Up next: ${DAYS[nextDay()].name}.`)+(filled.length?`<div class="note" style="margin:6px 0 0">Filled as written (the grey numbers): ${esc(filled.join(' · '))}. Open the session from History if any of those were different.</div>`:'');view.day=nextDay();view.date=iso(today());view.resumed=null;}render();window.scrollTo({top:0,behavior:'smooth'});};
App.clearSub=id=>{delete S.subs[id];save();render();};
App.exportJSON=()=>{const m=document.getElementById('bkmsg');navigator.clipboard.writeText(JSON.stringify(S)).then(()=>m.textContent='Copied. Paste it somewhere safe (Notes, email).').catch(()=>{document.getElementById('imp').value=JSON.stringify(S);m.textContent='Clipboard blocked — backup placed in the box below; select all and copy.';});};
App.importJSON=()=>{const m=document.getElementById('bkmsg');try{const R=JSON.parse(document.getElementById('imp').value);if(!R.sessions)throw 0;S=Object.assign(S,R);save();render();m.textContent='Restored.';}catch(e){m.textContent='That didn\'t parse as a backup.';}};
App.delSession=()=>{const sess=getSession(view.day,view.date,false);if(!sess)return;openSheet(`<h3>Delete this workout?</h3><p class="note">Removes every set logged for ${DAYS[sess.day].name} on ${fmtDate(sess.date)}${sess.done?' and un-counts it from the round':''}. Other workouts are untouched.</p><div class="row"><button class="btn" onclick="App.closeSheet()">Keep</button><button class="btn danger" onclick="App.delSessionYes('${sess.key}')">Delete</button></div>`);};
App.delSessionYes=k=>{delete S.sessions[k];save();App.closeSheet();view.day=null;render();window.scrollTo(0,0);};
App.wipe=()=>{openSheet(`<h3>Erase all logs?</h3><p class="note">This clears every session and sub on this device and your account copy.</p><div class="row"><button class="btn" onclick="App.closeSheet()">Keep</button><button class="btn danger" onclick="App.wipeYes()">Erase</button></div>`);};
App.wipeYes=()=>{S={startDate:S.startDate,program:S.program,level:S.level,block:1,ladders:S.ladders||{},prs:{},sessions:{},subs:{},trainer:S.trainer,updatedAt:0};save();App.closeSheet();render();};

// sub sheet
let subTarget=null,subMode='today';
App.openSub=sid=>{subTarget=sid;subMode='today';const slot=findSlot(sid);const sx=getSession(view.day,view.date,false);const w=sx?sx.week:currentWeek();const base=baseName(slot);const cur=curName(slot,sx,w);const rng=repsOf(slot,w)||[0,0];const key=prKey(slot,cur);
  const opts=[base,...slot.subs,slot.travel].map(n=>`<button class="opt ${n===cur?'cur':''}" onclick="App.pickSub(${JSON.stringify(n).replace(/"/g,'&quot;')})">${esc(n)}${n===base?' <span class="tag">program</span>':''}${n===slot.travel?' <span class="tag rot">no gym</span>':''}</button>`).join('');
  openSheet(`<h3>Swap exercise</h3><p class="note">Same sets, reps and rest. A swapped exercise keeps its own history — it never borrows the original's weights.</p><div class="seg"><button class="on" id="sm-today" onclick="App.subMode('today')">Just today</button><button id="sm-always" onclick="App.subMode('always')">From now on</button></div>${opts}<input type="text" id="subOther" placeholder="Other exercise…" style="text-align:left;margin-top:4px"><div class="row"><button class="btn p" onclick="App.pickSub(document.getElementById('subOther').value)">Use typed name</button></div><div class="row"><button class="btn danger" onclick="App.skip('${sid}')">Skip this one today</button></div>${S.trainer?`<h3 style="margin-top:14px">Known best for ${esc(cur)}</h3><p class="note">The heaviest weight she has done for ${rng[0]}–${rng[1]} clean reps — not a 1-rep max. Enter it and the ladder runs from session 1 instead of a find-your-weight session. A logged best from an earlier run of this block overrides it.</p><div class="row"><input type="number" inputmode="decimal" id="prIn" placeholder="${S.prs[key]||'lb'}"><button class="btn sm p" onclick="App.setPR(${JSON.stringify(key).replace(/"/g,'&quot;')},document.getElementById('prIn').value)">Set</button>${S.prs[key]?`<button class="btn sm" onclick="App.setPR(${JSON.stringify(key).replace(/"/g,'&quot;')},'')">Clear</button>`:''}</div>`:''}`);};
App.subMode=m=>{subMode=m;document.getElementById('sm-today').classList.toggle('on',m==='today');document.getElementById('sm-always').classList.toggle('on',m==='always');};
App.pickSub=n=>{n=(n||'').trim();if(!n)return;const slot=findSlot(subTarget);const sess=getSession(view.day,view.date,true);const w=sess.week;const base=baseName(slot);
  if(subMode==='always'){if(n===base)delete S.subs[subTarget];else S.subs[subTarget]=n;}
  sess.entries[subTarget]=newEntry(slot,n,sess);
  save();App.closeSheet();render();};
function openSheet(h){document.getElementById('sheet').innerHTML=h;document.getElementById('sheetBg').classList.add('on');requestAnimationFrame(()=>document.getElementById('sheet').classList.add('on'));}
App.closeSheet=()=>{document.getElementById('sheet').classList.remove('on');document.getElementById('sheetBg').classList.remove('on');};

// timer
let tEnd=0,tInt=null;
App.timerStart=s=>{tEnd=Date.now()+s*1000;const t=document.getElementById('timer');t.classList.add('on');t.classList.remove('done');clearInterval(tInt);tInt=setInterval(tick,250);tick();};
App.timerAdd=s=>{tEnd+=s*1000;document.getElementById('timer').classList.remove('done');tick();};
App.timerStop=()=>{clearInterval(tInt);document.getElementById('timer').classList.remove('on');};
function tick(){const left=Math.max(0,Math.round((tEnd-Date.now())/1000));document.getElementById('timerTxt').textContent=left>0?`Rest ${Math.floor(left/60)}:${pad(left%60)}`:'Go — next set';if(left<=0){document.getElementById('timer').classList.add('done');clearInterval(tInt);try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}}

// ---------- BOOT ----------
load();openWhereYouLeftOff();window.addEventListener('hashchange',render);render();
setSync('local');if(window.claude&&window.claude.use)initRemote();else setTimeout(()=>{if(window.claude&&window.claude.use)initRemote();else setSync('local');},1500);
</script>
